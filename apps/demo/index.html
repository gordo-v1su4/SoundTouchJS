<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundTouchJS Demo</title>
    <style>
      body {
        background: grey;
        line-height: 30px;
        font-family: system-ui, sans-serif;
      }

      input,
      button {
        display: block;
      }

      .progress,
      #progressMeter {
        width: 400px;
      }

      .progress #duration {
        position: relative;
        float: right;
      }

      .mode-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .mode-toggle button {
        display: inline-block;
        padding: 6px 14px;
        border: 2px solid #333;
        background: #ddd;
        cursor: pointer;
        font-size: 14px;
      }

      .mode-toggle button.active {
        background: #333;
        color: #fff;
      }

      .source-picker {
        display: grid;
        gap: 8px;
        margin: 16px 0;
        max-width: 400px;
      }

      .source-label {
        font-size: 14px;
      }

      .control {
        display: grid;
        gap: 6px;
        margin: 14px 0;
        max-width: 400px;
      }

      .control-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .control-header label {
        font-size: 14px;
      }

      .control-header input[type='number'] {
        width: 88px;
      }

      .control input[type='range'] {
        width: 100%;
      }

      #codeBlock {
        margin-top: 16px;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 16px;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        white-space: pre;
        overflow-x: auto;
        max-width: 640px;
        line-height: 1.5;
      }

      audio {
        display: block;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h3>SoundTouchJS AudioWorklet Demo</h3>
    <div class="mode-toggle">
      <button id="modeBuffer" class="active">AudioBuffer</button>
      <button id="modeElement">Audio Element</button>
    </div>
    <div class="source-picker">
      <label for="audioFile">Load your own audio file</label>
      <input id="audioFile" type="file" accept="audio/*" />
      <div class="source-label">
        Current source: <span id="sourceName"></span>
      </div>
    </div>
    <div id="bufferControls">
      <button id="play" disabled>Play</button>
      <button id="stop">Pause</button>
      <div class="progress">
        <div><span id="currentTime">0:00</span><span id="duration"></span></div>
        <progress id="progressMeter" value="0" max="100"></progress>
      </div>
    </div>
    <div id="elementControls" style="display: none">
      <audio id="audioEl" controls></audio>
    </div>
    <div class="control">
      <div class="control-header">
        <label for="tempoSlider">Tempo (keep pitch)</label>
        <input
          type="number"
          min="0.1"
          max="4.0"
          step="0.01"
          value="1.00"
          id="tempoInput"
        />
      </div>
      <input
        type="range"
        autofocus
        min="0.1"
        max="4.0"
        name="tempoSlider"
        value="1.0"
        id="tempoSlider"
        step="0.01"
        list="temporange"
      />
    </div>
    <datalist id="temporange">
      <option value="0.1" label="0"></option>
      <option value="0.5"></option>
      <option value="1.0"></option>
      <option value="1.5"></option>
      <option value="2.0"></option>
      <option value="2.5"></option>
      <option value="3.0"></option>
      <option value="3.5"></option>
      <option value="4.0" label="4"></option>
    </datalist>
    <div class="control">
      <div class="control-header">
        <label for="pitchSlider">Pitch multiplier</label>
        <input
          type="number"
          min="0.1"
          max="2.0"
          step="0.01"
          value="1.00"
          id="pitchInput"
        />
      </div>
      <input
        type="range"
        autofocus
        min="0.1"
        max="2.0"
        name="pitchSlider"
        value="1.0"
        id="pitchSlider"
        step="0.01"
        list="pitchrange"
      />
    </div>
    <datalist id="pitchrange">
      <option value="0.1" label="0"></option>
      <option value="0.5"></option>
      <option value="1.0"></option>
      <option value="1.5"></option>
      <option value="2.0" label="2"></option>
    </datalist>

    <div class="control">
      <div class="control-header">
        <label for="keySlider">Change key (semitones)</label>
        <input
          type="number"
          min="-7"
          max="7"
          step="1"
          value="0"
          id="keyInput"
        />
      </div>
      <input
        type="range"
        autofocus
        min="-7.0"
        max="7.0"
        name="keySlider"
        value="0"
        id="keySlider"
        step="1"
        list="keyrange"
      />
    </div>
    <datalist id="keyrange">
      <option value="-7"></option>
      <option value="-6"></option>
      <option value="-5"></option>
      <option value="-4"></option>
      <option value="-3"></option>
      <option value="-2"></option>
      <option value="-1"></option>
      <option value="0"></option>
      <option value="1"></option>
      <option value="2"></option>
      <option value="3"></option>
      <option value="4"></option>
      <option value="5"></option>
      <option value="6"></option>
      <option value="7"></option>
    </datalist>

    <div class="control">
      <div class="control-header">
        <label for="volumeSlider">Volume</label>
        <input
          type="number"
          min="0.0"
          max="10.0"
          step="0.01"
          value="1.00"
          id="volumeInput"
        />
      </div>
      <input
        type="range"
        autofocus
        min="0.0"
        max="10.0"
        name="volumeSlider"
        value="1.0"
        id="volumeSlider"
        step="0.01"
        list="volumerange"
      />
    </div>
    <datalist id="volumerange">
      <option value="0.0" label="0"></option>
      <option value="0.5"></option>
      <option value="1.0"></option>
      <option value="1.5"></option>
      <option value="2.0" label="2"></option>
      <option value="2.5"></option>
      <option value="3.0"></option>
      <option value="3.5"></option>
      <option value="4.0" label="4"></option>
      <option value="4.5"></option>
      <option value="5.0"></option>
      <option value="5.5"></option>
      <option value="6.0" label="6"></option>
      <option value="6.5"></option>
      <option value="7.0"></option>
      <option value="7.5"></option>
      <option value="8.0" label="8"></option>
      <option value="8.5"></option>
      <option value="9.0"></option>
      <option value="9.5"></option>
      <option value="10.0" label="10"></option>
    </datalist>
    <div id="codeBlock"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
